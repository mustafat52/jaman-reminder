@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121614;--card:#1b211e;--ink:#eef2ef;--mute:#98a39d;--line:#2a322e;--g:#3fb67a;--gl:#1d3328;--sent:#66706b;color-scheme:dark}}

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--mute);font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.sub button{background:none;border:0;color:var(--mute);text-decoration:underline;font:inherit;padding:4px}
input{width:100%;margin-top:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
ul{list-style:none;margin:0;padding:8px 12px 40px;max-width:640px;margin-inline:auto}
li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 14px;margin-top:8px}
li .who{flex:1;min-width:0}
.nm{font-weight:600;overflow-wrap:anywhere}
.ph{color:var(--mute);font-size:14px}
.tag{font-size:13px;color:#a05a00}
.btn{flex:none;min-width:92px;text-align:center;padding:11px 12px;border-radius:10px;background:var(--g);color:#fff;text-decoration:none;font-weight:600;font-size:15px}
li.sent{opacity:.6}
li.sent .btn{background:var(--gl);color:var(--g)}
li.none .btn{background:transparent;color:var(--sent);border:1px dashed var(--line);pointer-events:none}

const KEY="jaman-sent-v1";
let sent={};
try{sent=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(sent))}catch(e){}}
const list=document.getElementById("list"),q=document.getElementById("q"),count=document.getElementById("count");
function render(){
  const s=q.value.trim().toLowerCase();
  list.innerHTML="";
  let done=0,total=0;
  PEOPLE.forEach((p,i)=>{
    if(p.p){total++; if(sent[i])done++;}
    if(s&&!(p.n.toLowerCase().includes(s)||p.p.includes(s)))return;
    const li=document.createElement("li");
    if(!p.p)li.className="none"; else if(sent[i])li.className="sent";
    const who=document.createElement("div");who.className="who";
    const nm=document.createElement("div");nm.className="nm";nm.textContent=p.n;
    const ph=document.createElement("div");ph.className="ph";ph.textContent=p.p||"No number";
    who.append(nm,ph);
    if(p.t){const t=document.createElement("div");t.className="tag";t.textContent=p.t;who.append(t)}
    const a=document.createElement("a");a.className="btn";
    if(p.p){
      a.href="https://wa.me/91"+p.p+"?text="+encodeURIComponent(MSG);
      a.target="_blank";a.rel="noopener";
      a.textContent=sent[i]?"Sent ✓":"Send reminder";
      a.addEventListener("click",()=>{sent[i]=1;save();setTimeout(render,400)});
    }else{a.textContent="No number"}
    li.append(who,a);list.append(li);
  });
  count.textContent=done+" of "+total+" reminded";
}
q.addEventListener("input",render);
document.getElementById("reset").addEventListener("click",()=>{if(confirm("Clear all sent ticks?")){sent={};save();render()}});
render();
